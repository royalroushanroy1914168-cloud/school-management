  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.dashboard-layout{display:flex;min-height:100vh}.sidebar{width:250px;background:#082e5e;color:white;padding:20px;position:fixed;inset:0 auto 0 0;overflow:auto}.sidebar-logo{display:flex;gap:10px;align-items:center;margin-bottom:25px}.logo{width:45px;height:45px;border-radius:50%;background:#f0ad24;color:#172033;display:grid;place-items:center;font-weight:bold}.sidebar a{display:block;padding:11px;color:#dbeafe;text-decoration:none;border-radius:7px;margin:3px 0}.sidebar a:hover,.sidebar a.active{background:#07539b;color:white}.logout{width:100%;margin-top:20px;background:#d9534f}.main{margin-left:250px;width:calc(100% - 250px);padding:25px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.card{background:white;padding:22px;border-radius:12px;margin-bottom:20px;box-shadow:0 4px 18px #0000000b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:white;padding:20px;border-radius:12px}.stat b{font-size:28px;display:block;margin-top:8px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}input,select,textarea{padding:11px;border:1px solid #d5dce5;border-radius:7px}.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}.btn{background:#07539b;color:white;padding:10px 16px;border:0;border-radius:7px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;background:white}th,td{padding:11px;border-bottom:1px solid #e6ebf1;text-align:left}th{background:#f4f7fa}.notice{padding:14px;background:#fff4d6;border-left:5px solid #f0ad24;margin-bottom:18px}@media(max-width:750px){.sidebar{position:static;width:100%;}.dashboard-layout{display:block}.main{margin:0;width:100%}.stats{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.head{display:block}}
  </style>
