<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notice Management</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="dashboard-shell"><aside class="sidebar"><div class="brand-mini">🏫 ABC School</div><h3>Notice Management</h3><a href="/admin-dashboard.html">Dashboard</a><a href="#" onclick="logout()">🚪 Logout</a></aside>
<main class="content"><div class="topbar"><h1>Notice Management</h1></div>
<div class="panel"><form id="form" class="dashboard-form">
<input id="title" placeholder="Notice title" required><textarea id="body" placeholder="Notice message" required></textarea>
<select id="target_role"><option value="all">Everyone</option><option value="student">Students</option><option value="teacher">Teachers</option><option value="parent">Parents</option></select>
<button class="primary">Publish Notice</button></form><p id="msg"></p></div><div class="panel"><h2>Published Notices</h2><div id="list"></div></div>
</main>
<script src="/js/auth.js"></script><script>requireRole("admin");
async function load(){const d=await api("/notices");list.innerHTML=d.notices.map(n=>"<div class='notice-item'><h3>"+esc(n.title)+"</h3><p>"+esc(n.body)+"</p></div>").join("")||"No notices"}
form.onsubmit=async e=>{e.preventDefault();try{await api("/notices",{method:"POST",body:JSON.stringify({title:title.value,body:body.value,target_role:target_role.value,published:true})});msg.textContent="Published";form.reset();load()}catch(x){msg.textContent=x.message}};load();
</script></body></html>
