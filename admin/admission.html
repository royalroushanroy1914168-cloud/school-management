<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admission Management</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="dashboard-shell"><aside class="sidebar"><div class="brand-mini">🏫 ABC School</div><h3>Admission Management</h3><a href="/admin-dashboard.html">Dashboard</a><a href="#" onclick="logout()">🚪 Logout</a></aside>
<main class="content"><div class="topbar"><h1>Admission Management</h1></div>
<div class="panel"><form id="form" class="dashboard-form form-grid">
<input id="application_no" placeholder="Application No" required><input id="student_name" placeholder="Student Name" required>
<input id="class_name" placeholder="Class"><input id="parent_name" placeholder="Parent Name"><input id="phone" placeholder="Phone">
<div class="wide"><button class="primary">Submit Admission</button></div></form><p id="msg"></p></div>
<div class="panel"><h2>Applications</h2><div id="list"></div></div>
</main>
<script src="/js/auth.js"></script><script>requireRole("admin");
async function load(){try{const d=await api("/admissions");list.innerHTML="<div class='table-wrap'><table><tr><th>Application</th><th>Student</th><th>Class</th><th>Status</th></tr>"+d.admissions.map(a=>"<tr><td>"+esc(a.application_no)+"</td><td>"+esc(a.student_name)+"</td><td>"+esc(a.class_name)+"</td><td>"+esc(a.status)+"</td></tr>").join("")+"</table></div>"}catch(e){list.textContent=e.message}}
form.onsubmit=async e=>{e.preventDefault();try{await api("/admissions",{method:"POST",body:JSON.stringify({application_no:application_no.value,student_name:student_name.value,class_name:class_name.value,parent_name:parent_name.value,phone:phone.value})});msg.textContent="Admission saved";form.reset();load()}catch(x){msg.textContent=x.message}};load();
</script></body></html>
