<!doctype html><html><head><meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>New Admission</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.dashboard-layout{display:flex;min-height:100vh}.sidebar{width:250px;background:#082e5e;color:white;padding:20px;position:fixed;inset:0 auto 0 0;overflow:auto}.sidebar-logo{display:flex;gap:10px;align-items:center;margin-bottom:25px}.logo{width:45px;height:45px;border-radius:50%;background:#f0ad24;color:#172033;display:grid;place-items:center;font-weight:bold}.sidebar a{display:block;padding:11px;color:#dbeafe;text-decoration:none;border-radius:7px;margin:3px 0}.sidebar a:hover,.sidebar a.active{background:#07539b;color:white}.logout{width:100%;margin-top:20px;background:#d9534f}.main{margin-left:250px;width:calc(100% - 250px);padding:25px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.card{background:white;padding:22px;border-radius:12px;margin-bottom:20px;box-shadow:0 4px 18px #0000000b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:white;padding:20px;border-radius:12px}.stat b{font-size:28px;display:block;margin-top:8px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}input,select,textarea{padding:11px;border:1px solid #d5dce5;border-radius:7px}.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}.btn{background:#07539b;color:white;padding:10px 16px;border:0;border-radius:7px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;background:white}th,td{padding:11px;border-bottom:1px solid #e6ebf1;text-align:left}th{background:#f4f7fa}.notice{padding:14px;background:#fff4d6;border-left:5px solid #f0ad24;margin-bottom:18px}@media(max-width:750px){.sidebar{position:static;width:100%;}.dashboard-layout{display:block}.main{margin:0;width:100%}.stats{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.head{display:block}}
  </style>
  <script src="/js/auth.js" defer></script>
  <script src="/js/admin.js" defer></script>
</head><body><div class="dashboard-layout">
    <aside class="sidebar"><div class="sidebar-logo">
      <div class="logo">ABC</div><div><b>ABC Public School</b><small>Admin Panel</small></div>
    </div>
      <a href="/admin/admission.html">Admission</a>
<a href="/admin/students.html">Students</a>
<a href="/admin/teacher.html">Teachers</a>
<a href="/admin/principal.html">Principals</a>
<a href="/admin/attendance.html">Attendance</a>
<a href="/admin/exam.html">Exams</a>
<a href="/admin/fees.html">Fees</a>
<a href="/admin/marks.html">Marks</a>
<a href="/admin/notices.html">Notices</a>
<a href="/admin/setting.html">Settings</a>
      <button class="logout" id="logoutBtn">Logout</button>
    </aside><main class="main"><header class="head">
      <div><h1>New Admission</h1>
        <p>ABC Public School Management System</p>
      </div></header><div class="card"><form id="admissionForm"><div class="form-grid"><div class="field "><label>Student Name *</label>
        <input name='studentName' required></div><div class="field "><label>Father Name *</label><input name='fatherName' required></div>
        <div class="field "><label>Mother Name *</label><input name='motherName' required></div><div class="field "><label>DOB *</label>
          <input name='dob' type='date' required></div><div class="field "><label>Gender *</label>
            <select name='gender' required><option value=''>Select</option><option>Male</option><option>Female</option><option>Other</option>
            </select></div><div class="field "><label>Photo URL</label><input name='photo'></div><div class="field full"><label>Address *</label>
              <textarea name='address' required></textarea></div><div class="field "><label>Mobile</label><input name='mobile'></div>
        <div class="field "><label>Email</label><input name='email' type='email'></div><div class="field "><label>Academic Session *</label>
          
          <input name='academicSession' value='2026-27' required></div><div class="field "><label>Class *</label><input name='className' required></div><div class="field "><label>Section *</label><input name='section' required></div><div class="field "><label>Roll Number</label><input name='rollNumber'></div></div><div class="actions"><button class="btn">Create Admission</button></div><p id="admissionFormMsg"></p></form></div></main></div></body></html>
